name = "nexus-infinite-warfare"
main = "server/worker.js"
compatibility_date = "2025-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]
